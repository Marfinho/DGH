# Fester Projektname: Volumes heißen dorfplaner_*, unabhängig vom Ordnernamen (wichtig neben anderen Projekten).
name: dorfplaner

services:
  app:
    build: .
    image: dorfplaner-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/dorfplaner.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - dorfplaner-data:/data
    # Nur lokal erreichbar – davor sitzt ein Reverse Proxy (Caddy/nginx auf dem Server oder der Caddy unten).
    # APP_PORT bewusst nicht 3000/3001/5432, die belegen auf dem VPS oft andere Projekte.
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"

  # Zeitgesteuerte Aufrufe (UTC): 06:00 Erinnerungen + Aufräumen (7–8 Uhr), 16:00 Müll-Erinnerung (17–18 Uhr)
  reminders:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%s); sleep $$(( 3600 - now % 3600 + 5 ))
          h=$$(date -u +%H)
          if [ "$$h" = "06" ]; then curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders || true; fi
          if [ "$$h" = "16" ]; then curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/waste || true; fi
        done
    depends_on: [app]

  # Tägliches Backup (~3 Uhr) in das Volume: letzte 14 DB-Snapshots + Spiegel der Uploads.
  # Wichtig: zusätzlich regelmäßig extern sichern (siehe README)!
  backup:
    image: dorfplaner-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/dorfplaner.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    volumes:
      - dorfplaner-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%s); next=$$(( (now/86400)*86400 + 2*3600 ))
          if [ $$next -le $$now ]; then next=$$((next+86400)); fi
          sleep $$((next-now))
          npx tsx prisma/backup.ts || true
        done
    depends_on: [app]

  # Eigener Caddy nur, wenn auf dem Server noch nichts Port 80/443 belegt: COMPOSE_PROFILES=caddy in der .env.
  # Läuft schon ein Reverse Proxy (z. B. für andere Projekte), richtet deploy/install.sh dort einen Eintrag ein.
  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

volumes:
  dorfplaner-data:
  caddy-data:
  caddy-config:
